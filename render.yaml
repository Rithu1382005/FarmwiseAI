services:
  - type: web
    name: farmwiseai-backend
    env: python
    runtime: python
    region: singapore
    plan: free
    branch: feature/farmer-ux-chatbot-passport
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AWS_REGION
        value: ap-south-1
      - key: S3_BUCKET_NAME
        value: fai-tce-team06-crop-intel
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
